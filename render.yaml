services:
  - type: web
    name: whatsapp-bot-multidevice
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGODB_KEY
        sync: false
      - key: MY_NUMBER
        sync: false
      - key: BOT_NUMBER
        sync: false
      - key: PREFIX
        value: "-"
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
